<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        body.light{
            background-color: #f0f0f0;
            color: black;
        }
        body.dark{
            background-color: #212121;
            color: #ECDFCC;
        }
    </style>
    <div>
        <button id="dark">Dark</button> <br>
        
        

        <fieldset>
            <legend>Zadanie 1</legend>
            <div id="message">Hello world</div>
            <button id="changeBtn">Zmień</button>
        </fieldset>

        <fieldset>
            <legend>Zadanie 2</legend>
        
            <div style="margin-top:40px">
                <input type="text" id="itemInput" placeholder="Wpisz element"/>
                <button id="addBtn">Dodaj</button>
                <ul id="itemList"></ul>
            </div>
        </fieldset>

        <fieldset>
            <legend>Zadanie 3</legend>
        
            <div id="divLicznik">
                <p id="count">0</p>
                <button id="countOne">Klik</button>
            </div>
        </fieldset>

        <fieldset>
            <legend>Zadanie 4</legend>
            <form id="userForm">
                <input type="text" name="username" id="formUsername" placeholder="username">
                <input type="email" name="email" id="formEmail" placeholder="email">
                <button type="submit">Zapisz</button>
                <p id="dane"></p>
            </form>
        </fieldset>

        <fieldset>
            <legend>Zadanie 5</legend>
            Odwiedzin: <span id="counter"></span>
        </fieldset>



    </div>





    <script src="skrypt.js"></script>
</body>
</html>
