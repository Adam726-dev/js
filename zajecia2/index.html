<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <div class="content">
      <p class="capital">Stolica:</p>
    </div>


    <div class="container">
      <div id="loading" class="loading"></div>
      <div id="users-container" class="users-container">
        Użytkownicy:
      </div>
      <div id="error-message" class="error-message"></div>
    </div>

    <div class="posty">
      Posty:
      <div id="posts-container" class="posts-container"></div>
    </div>

    <fieldset>
      <legend>Formularz</legend>
      <form id="postForm" style="display: flex; flex-direction: column; gap: 10px; width: 400px;">
        <input type="text" id="title" placeholder="Tytuł" required>
        <textarea id="body" placeholder="Treść" rows="10" required></textarea>
        <button type="submit" id="btnSubmit">Wyślij</button>
      </form>

    <div id="message"></div>
    </fieldset>

    
    <script src="skrypt.js"></script>
    </script>
  </body>
</html>
